
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}ScentR — Perfume Recommender{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'perfumes/css/style.css' %}">
</head>

<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="{% url 'home' %}" class="wordmark">
                Scent<span>R</span><span class="wordmark-dot">.</span>
            </a>

            <nav aria-label="Main navigation">
                <a href="{% url 'perfume-search' %}">
                    The Index
                </a>
            </nav>
        </div>
    </header>

    <main class="site-main">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <span>scentR / Fragrance discovery</span>
            <span>
                Fragrance data:
                <a href="https://www.scento.com/perfume-database">
                    Scento
                </a>
            </span>
        </div>
    </footer>
</body>
</html>
