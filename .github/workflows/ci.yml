
name: Python CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      DB_NAME: scentr
      DB_USER: scentr_app
      DB_PASSWORD: ci-test-password
      DB_HOST: localhost
      DB_PORT: "5432"
      DJANGO_SECRET_KEY: ci-only-django-secret-key

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: scentr
          POSTGRES_USER: scentr_app
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit and Django tests
        run: python -m pytest -v

  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check linting
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .
